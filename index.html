<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#07061a;color:#eaf6ff;font-family:ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;display:flex;justify-content:center;align-items:stretch;}
  #app{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;padding:max(8px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));gap:6px;}

  #hud .iconbtn{width:28px;height:28px;border-radius:8px;border:1px solid rgba(120,160,200,.3);background:rgba(120,160,200,.08);color:#9fc4dd;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

  .padWrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .pad{width:72px;height:72px;border-radius:50%;cursor:pointer;position:relative;border:2px solid;background:radial-gradient(circle at 38% 32%, var(--g1), var(--g2));box-shadow:0 4px 0 var(--sh),0 0 22px var(--gl);transition:transform .08s,box-shadow .08s,opacity .15s;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;color:#04121a;touch-action:none;}
  .pad.L{--g1:#7df9ff;--g2:#13b6d6;--sh:#0a6e85;--gl:rgba(25,227,255,.55);border-color:#0a8aa6;}

  .overlay{position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center;background:rgba(7,6,26,.86);backdrop-filter:blur(3px);z-index:5;opacity:0;pointer-events:none;transition:opacity .3s;padding:22px;}

  #board h2{font-size:18px;color:#ffd24a;text-align:center;margin-bottom:10px;letter-spacing:1px;}

  #board .row{display:flex;justify-content:space-between;padding:7px 6px;border-bottom:1px solid rgba(120,160,200,.12);}
  #board .row .n{color:#9fc4dd;} #board .row .t{color:#7df9ff;} #board .row .c{color:#ffd24a;}
  #board .row.head{color:#7da6c4;font-weight:600;border-bottom:1px solid rgba(120,160,200,.3);}
  #board button{margin-top:12px;padding:10px;border-radius:10px;border:1px solid rgba(120,160,200,.4);background:rgba(120,160,200,.08);color:#9fc4dd;font-size:14px;cursor:pointer;}

  #rot{display:none;position:fixed;inset:0;background:#07061a;z-index:99;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#9fc4dd;font-size:16px;padding:30px;gap:12px;}
  #rot .big{font-size:38px;}
  @media (max-width:384px){ .pad{width:62px;height:62px;font-size:18px;} #hud .lv{font-size:13px;} #hud .stat{font-size:12px;} }
  @media (orientation:landscape) and (max-height:540px){ #app{display:none;} #rot{display:flex;} }
</style>

<body>
<div id="app">
  <div id="hud">
    <div class="lv" id="lvName">第 1 关</div>

<script>
(() => {
"use strict";

const W=440, H=760, WALL=16, LEFT=WALL, RIGHT=W-WALL, TOP=14, BOTTOM=H-14, BASE_R=11, MAX_HP=5;
const CFG={
  gravity:1500, maxSpeed:1800, restWall:0.50, restRail:0.42, restPeg:0.66,
  friction:0.12, airDrag:0.06, roll:0.86, sleepV:14,
  minImpulse:250, maxImpulse:760, chargeMs:1100, upRatio:0.55,
  springPop:1080, sandDragX:0.90, sandDragY:0.96, magnet:2600, slowDrag:0.86, bombR:66, batPower:840,
};
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const now=()=>performance.now();

function railSegs(y,gaps){ const sorted=gaps.slice().sort((a,b)=>a[0]-b[0]); const out=[]; let x=LEFT; for(const [gx,gw] of sorted){ const l=gx-gw/2,r=gx+gw/2; if(l>x)out.push([x,y,l,y]); x=Math.max(x,r);} if(x<RIGHT)out.push([x,y,RIGHT,y]); return out; }
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ===== 关卡生成器 =====
function genLevel(p){
  const rng=mulberry32(p.seed);
  const yTop=128, yBot=690, n=p.rails;
  const rails=[], pegs=[], boxes=[], sands=[], coins=[], rings=[], hearts=[];
  const half=p.gapW/2, minX=LEFT+half+16, maxX=RIGHT-half-16, mid=(minX+maxX)/2;
  const gc=[]; let gx=Math.round(clamp(lerp(minX,maxX,rng()),minX,maxX)); let dir=gx<mid?1:-1;
  for(let i=0;i<n;i++){ const y=Math.round(yTop+(yBot-yTop)*i/(n-1)); if(i>0){ let shift=lerp(70,p.shift||120,rng()); let ng=gx+dir*shift; if(ng<minX||ng>maxX){dir=-dir;ng=gx+dir*shift;} ng=clamp(ng,minX,maxX); if(Math.abs(ng-gx)<60){dir=-dir;ng=clamp(gx+dir*78,minX,maxX);} gx=ng; if(rng()<0.35)dir=-dir; } gx=Math.round(gx); gc.push([y,gx]); rails.push({y,gaps:[[gx,p.gapW]]}); }
  for(let i=0;i<n;i++){ if(rng()<p.pegRate){ const sd=rng()<0.5?-1:1; const px=clamp(Math.round(gc[i][1]+sd*(half+22+rng()*46)),LEFT+16,RIGHT-16); const py=Math.round(gc[i][0]-8-rng()*14); pegs.push([px,py]); } }
  for(let i=0;i<(p.extraPegs||0);i++){ const k=Math.floor(rng()*(n-1)); const sd=rng()<0.5?-1:1; const px=clamp(Math.round(gc[k][1]+sd*(half+30+rng()*44)),LEFT+16,RIGHT-16); const py=Math.round((gc[k][0]+gc[k+1][0])/2); pegs.push([px,py]); }
  for(let i=1;i<n;i++){ if(rng()<p.boxRate){ const x0=gc[i-1][1],x1=gc[i][1]; let bx=Math.round(lerp(Math.min(x0,x1),Math.max(x0,x1),0.35+rng()*0.3)); bx=clamp(bx,LEFT+22,RIGHT-22); boxes.push({x:bx,y:gc[i][0]-19,r:14,revealed:false,effect:null,flashT:0}); } }
  for(let i=1;i<n;i++){ if(rng()<p.sandRate){ const x0=gc[i-1][1],x1=gc[i][1]; let sx=Math.round(lerp(Math.min(x0,x1),Math.max(x0,x1),0.5)); sx=clamp(sx,LEFT+46,RIGHT-46); if(Math.abs(sx-gc[i][1])>half+24)sands.push({x:sx,y:gc[i][0],w:80}); } }
  for(let i=0;i<(p.rings||0);i++){ const k=2+Math.floor(rng()*Math.max(1,n-3)); const ry=Math.round((gc[k][0]+gc[k-1][0])/2); const rx=clamp(Math.round(rand(LEFT+60,RIGHT-60)),LEFT+50,RIGHT-50); rings.push({x:rx,y:ry,r:26}); }
  for(let i=0;i<(p.hearts||0);i++){ const k=Math.floor(rng()*n); const hx=clamp(Math.round(gc[k][1]+(rng()*2-1)*80),LEFT+18,RIGHT-18); const hy=Math.round(gc[k][0]-14); hearts.push({x:hx,y:hy,got:false}); }
  for(let i=0;i<(p.coins||0);i++){ const k=Math.floor(rng()*n); const cx=clamp(Math.round(gc[k][1]+(rng()*2-1)*78),LEFT+18,RIGHT-18); const span=k>0?(gc[k][0]-gc[k-1][0]):44; const cy=Math.round(gc[k][0]-12-rng()*Math.min(span*0.4,40)); coins.push([cx,cy]); }
  const pf=pegs.filter(p2=>{ for(const c of gc){ if(Math.abs(p2[0]-c[1])<half+10 && p2[1]>c[0] && p2[1]<c[0]+52) return false; } return true; });
  const last=gc[n-1];
  const bx=clamp(Math.round(gc[0][1]+(gc[0][1]<mid?1:-1)*70),LEFT+22,RIGHT-22);
  return { name:p.name, par:p.par, ball:[bx,76], rails, pegs:pf, boxes, sands, coins, rings, hearts, exit:[Math.round(last[1]),716,23], tip:p.tip };
}
const LEVEL_PARAMS=[
  {seed:11,name:"起步",par:5,rails:6,gapW:46,shift:88,pegRate:0.3,extraPegs:0,boxRate:0.5,sandRate:0,rings:0,hearts:0,coins:5,tip:"长按蓄力松开弹射，把球漏到底部光环。路上金币顺手收，碰碰问号盒"},
  {seed:23,name:"问号盒",par:6,rails:7,gapW:44,shift:98,pegRate:0.35,extraPegs:0,boxRate:0.85,sandRate:0,rings:0,hearts:0,coins:6,tip:"问号盒碰到才揭晓——大奖直接通关，也可能棒子把你弹飞"},
  {seed:37,name:"钉子阵",par:7,rails:8,gapW:43,shift:104,pegRate:0.55,extraPegs:2,boxRate:0.5,sandRate:0,rings:0,hearts:1,coins:6,tip:"缝旁有钉子，撞到弹偏；连撞钉子涨连击"},
  {seed:41,name:"沙地",par:7,rails:8,gapW:42,shift:104,pegRate:0.45,extraPegs:1,boxRate:0.55,sandRate:0.5,rings:0,hearts:0,coins:7,tip:"灰色沙地让球减速，借机停稳再瞄"},
  {seed:53,name:"火圈初见",par:8,rails:9,gapW:42,shift:106,pegRate:0.4,extraPegs:1,boxRate:0.6,sandRate:0.3,rings:1,hearts:1,coins:7,tip:"火圈碰到环边会扣血！从环中心钻过去或绕开"},
  {seed:67,name:"盒子多多",par:8,rails:9,gapW:41,shift:106,pegRate:0.45,extraPegs:2,boxRate:1.0,sandRate:0.3,rings:0,hearts:1,coins:8,tip:"满屏问号盒，赌一把重球/金币雨/直接通关"},
  {seed:79,name:"金币关",par:9,rails:10,gapW:41,shift:108,pegRate:0.5,extraPegs:2,boxRate:0.6,sandRate:0.4,rings:1,hearts:1,coins:11,tip:"金币超多，看你能收多少；当心火圈"},
  {seed:97,name:"双火圈",par:9,rails:10,gapW:40,shift:108,pegRate:0.5,extraPegs:2,boxRate:0.6,sandRate:0.4,rings:2,hearts:2,coins:8,tip:"两个火圈，留心血量，血包要捡"},
  {seed:113,name:"窄缝",par:10,rails:11,gapW:39,shift:110,pegRate:0.5,extraPegs:3,boxRate:0.6,sandRate:0.4,rings:1,hearts:1,coins:8,tip:"缝更窄，精准控力；缩小球盲盒能帮大忙"},
  {seed:131,name:"沙海",par:10,rails:11,gapW:39,shift:110,pegRate:0.45,extraPegs:2,boxRate:0.6,sandRate:0.7,rings:1,hearts:1,coins:9,tip:"到处是沙地，速度难起来，耐心瞄"},
  {seed:151,name:"钉海火圈",par:11,rails:11,gapW:38,shift:112,pegRate:0.65,extraPegs:4,boxRate:0.6,sandRate:0.3,rings:2,hearts:2,coins:9,tip:"钉子+火圈，险象环生，连击拿分"},
  {seed:173,name:"盒海",par:11,rails:12,gapW:38,shift:112,pegRate:0.5,extraPegs:2,boxRate:1.0,sandRate:0.3,rings:1,hearts:2,coins:10,tip:"几乎每层都有盒子，运气与技术并重"},
  {seed:193,name:"地狱火",par:12,rails:12,gapW:37,shift:114,pegRate:0.55,extraPegs:3,boxRate:0.7,sandRate:0.4,rings:3,hearts:2,coins:9,tip:"三个火圈，保命要紧，血包别错过"},
  {seed:211,name:"极窄",par:13,rails:12,gapW:36,shift:114,pegRate:0.55,extraPegs:3,boxRate:0.7,sandRate:0.4,rings:2,hearts:2,coins:9,tip:"1.6倍球径的窄缝，控力极限"},
  {seed:233,name:"终极考验",par:14,rails:13,gapW:36,shift:116,pegRate:0.6,extraPegs:4,boxRate:0.8,sandRate:0.4,rings:3,hearts:3,coins:10,tip:"所有花样的总和——速度、金币、保命，全都要"},
];
const LEVELS=LEVEL_PARAMS.map(genLevel);

// ===== 盲盒效果池(加权)：好运/特殊球/陷阱，极端项稀有 =====
const EFFECTS=[
  {k:'coin',   w:15,name:'+5 金币',color:'#ffd24a',good:true},
  {k:'boost',  w:9, name:'冲刺',color:'#ffe14d',good:true},
  {k:'rocket', w:8, name:'火箭弹起',color:'#3dff9e',good:true},
  {k:'magnet', w:7, name:'磁吸出口',color:'#ff8ad6',good:true},
  {k:'shrink', w:8, name:'缩小球',color:'#9becff',good:true},
  {k:'bomb',   w:8, name:'炸弹球',color:'#ff7a33',good:true},
  {k:'pierce', w:7, name:'穿透球',color:'#b6e6ff',good:true},
  {k:'heavy',  w:7, name:'超重球',color:'#9aa6c0',good:true},
  {k:'coinrain',w:7,name:'金币雨！',color:'#ffd24a',good:true},
  {k:'heal',   w:6, name:'回血 +1',color:'#ff5d7a',good:true},
  {k:'jackpot',w:5, name:'金币大奖 +20',color:'#ffd24a',good:true},
  {k:'warp',   w:3, name:'直接通关！',color:'#3dff9e',good:true},
  {k:'slow',   w:7, name:'减速',color:'#8aa0b8',good:false},
  {k:'grow',   w:6, name:'巨化球',color:'#c98aff',good:false},
  {k:'knock',  w:6, name:'乱弹',color:'#ff5d7a',good:false},
  {k:'freeze', w:5, name:'冰冻',color:'#7fc8ff',good:false},
  {k:'bat',    w:5, name:'棒子弹飞！',color:'#ff5d7a',good:false},
  {k:'hurt',   w:4, name:'扣血 -1',color:'#ff3355',good:false},
  {k:'back',   w:4, name:'打回上一步',color:'#c98aff',good:false},
  {k:'reset',  w:2, name:'打回起点！',color:'#ff3355',good:false},
];
const EFF_TOTAL=EFFECTS.reduce((s,e)=>s+e.w,0);
function pickEffect(){ let r=Math.random()*EFF_TOTAL; for(const e of EFFECTS){ if(r<e.w)return e; r-=e.w; } return EFFECTS[0]; }

// ===== 实体 =====
const ball={x:0,y:0,vx:0,vy:0,r:BASE_R,mode:'normal',modeUntil:0,sizeUntil:0,magnetUntil:0,slowUntil:0,frozenUntil:0,invUntil:0,combo:0,maxCombo:0,hp:3,checkpoints:[]};
let segs=[], pegs=[], boxes=[], sands=[], coins=[], rings=[], hearts=[], minis=[], exit={x:0,y:0,r:23}, levelStart={x:0,y:0};
let landed=false, score=0, coinCount=0, gameT0=0, elapsed=0, coinsAtLevelStart=0;
const labels=[];

function buildLevel(i){
  const L=LEVELS[i];
  segs=[[LEFT,TOP,RIGHT,TOP],[LEFT,TOP,LEFT,BOTTOM],[RIGHT,TOP,RIGHT,BOTTOM],[LEFT,BOTTOM,RIGHT,BOTTOM]];
  for(const r of L.rails) for(const s of railSegs(r.y,r.gaps)) segs.push(s);
  pegs=(L.pegs||[]).map(p=>({x:p[0],y:p[1],r:7}));
  boxes=(L.boxes||[]).map(b=>({...b}));
  sands=(L.sands||[]).map(s=>({...s}));
  coins=(L.coins||[]).map(c=>({x:c[0],y:c[1],r:7,got:false}));
  rings=(L.rings||[]).map(r=>({...r,rot:Math.random()*6.28}));
  hearts=(L.hearts||[]).map(h=>({...h}));
  minis=[];
  exit={x:L.exit[0],y:L.exit[1],r:L.exit[2]};
  levelStart={x:L.ball[0],y:L.ball[1]};
  ball.x=L.ball[0]; ball.y=L.ball[1]; ball.vx=0; ball.vy=0; ball.r=BASE_R;
  ball.mode='normal'; ball.modeUntil=0; ball.sizeUntil=0; ball.magnetUntil=0; ball.slowUntil=0; ball.frozenUntil=0; ball.invUntil=0; ball.combo=0; ball.maxCombo=0;
  ball.checkpoints=[{x:L.ball[0],y:L.ball[1]}];
  trail.length=0; labels.length=0;
}

function collideSegment(b,ax,ay,bx,by,e){
  const abx=bx-ax,aby=by-ay,ab2=abx*abx+aby*aby||1e-6; let t=clamp(((b.x-ax)*abx+(b.y-ay)*aby)/ab2,0,1);
  const cx=ax+abx*t,cy=ay+aby*t; let nx=b.x-cx,ny=b.y-cy; let d2=nx*nx+ny*ny; if(d2>=b.r*b.r)return false;
  let d=Math.sqrt(d2)||1e-6; nx/=d; ny/=d; b.x+=nx*(b.r-d); b.y+=ny*(b.r-d); const vn=b.vx*nx+b.vy*ny;
  if(vn<0){ const jn=-(1+e)*vn; b.vx+=jn*nx; b.vy+=jn*ny; const vn2=b.vx*nx+b.vy*ny; b.vx-=(b.vx-vn2*nx)*CFG.friction; b.vy-=(b.vy-vn2*ny)*CFG.friction; return Math.abs(vn); } return 0.0001;
}
function collidePeg(b,p){
  if(b.mode==='pierce') return false;
  let nx=b.x-p.x,ny=b.y-p.y; const rr=b.r+p.r; let d2=nx*nx+ny*ny; if(d2>=rr*rr)return false;
  let d=Math.sqrt(d2)||1e-6; nx/=d; ny/=d; b.x+=nx*(rr-d); b.y+=ny*(rr-d);
  const e=b.mode==='heavy'?0.32:CFG.restPeg; const vn=b.vx*nx+b.vy*ny;
  if(vn<0){ const jn=-(1+e)*vn; b.vx+=jn*nx; b.vy+=jn*ny; const vn2=b.vx*nx+b.vy*ny; b.vx-=(b.vx-vn2*nx)*CFG.friction; b.vy-=(b.vy-vn2*ny)*CFG.friction; return Math.abs(vn); } return 0.0001;
}
function resolveContacts(b,fx){
  let contact=false,impact=0,pegHit=false;
  for(let k=0;k<segs.length;k++){ const s=segs[k]; const e=(s[1]===s[3]&&(s[1]===TOP||s[1]===BOTTOM))?CFG.restWall:(s[0]===s[2])?CFG.restWall:CFG.restRail; const r=collideSegment(b,s[0],s[1],s[2],s[3],e); if(r!==false){contact=true;if(r>impact)impact=r;} }
  for(let k=0;k<pegs.length;k++){ const r=collidePeg(b,pegs[k]); if(r!==false){contact=true;pegHit=true;if(r>impact)impact=r;if(fx&&r>40)pegs[k].flash=now();} }
  return {contact,impact,pegHit};
}

function revealBox(box){ const e=pickEffect(); box.revealed=true; box.effect=e; box.flashT=now(); labels.push({x:box.x,y:box.y,text:e.name,color:e.color,life:1.5}); burst(box.x,box.y,e.color,18,300); sfx(e.good?'reveal':'bad'); applyEffect(e.k); }
function setSize(mult,ms){ ball.r=BASE_R*mult; ball.sizeUntil=now()+ms; }
function applyEffect(k){
  const sp=Math.hypot(ball.vx,ball.vy)||1;
  if(k==='coin') coinCount+=5;
  else if(k==='jackpot') coinCount+=20;
  else if(k==='boost'){ const m=Math.max(sp,200); ball.vx=ball.vx/sp*Math.min(m*2.0,CFG.maxSpeed); ball.vy=ball.vy/sp*Math.min(m*2.0,CFG.maxSpeed); }
  else if(k==='rocket') ball.vy=-CFG.springPop*1.35;
  else if(k==='magnet') ball.magnetUntil=now()+2600;
  else if(k==='shrink') setSize(0.6,6000);
  else if(k==='grow') setSize(1.55,5000);
  else if(k==='bomb'){ ball.mode='bomb'; ball.modeUntil=now()+8000; }
  else if(k==='pierce'){ ball.mode='pierce'; ball.modeUntil=now()+4500; }
  else if(k==='heavy'){ ball.mode='heavy'; ball.modeUntil=now()+9000; ball.r=BASE_R*1.4; ball.sizeUntil=now()+9000; }
  else if(k==='coinrain') spawnCoinRain();
  else if(k==='heal'){ ball.hp=Math.min(MAX_HP,ball.hp+1); updHud(); }
  else if(k==='warp'){ if(!landed){landed=true; onWin();} }
  else if(k==='slow') ball.slowUntil=now()+1500;
  else if(k==='freeze') ball.frozenUntil=now()+1600;
  else if(k==='knock'){ const a=rand(0,Math.PI*2); ball.vx+=Math.cos(a)*520; ball.vy-=Math.abs(Math.sin(a))*420; }
  else if(k==='bat'){ const a=rand(-0.9,0.9); ball.vx=Math.sin(a)*CFG.batPower; ball.vy=-Math.abs(Math.cos(a))*CFG.batPower; }
  else if(k==='hurt'){ damage(1); }
  else if(k==='back'){ const cp=ball.checkpoints[ball.checkpoints.length-1]; if(cp){ball.x=cp.x;ball.y=cp.y;ball.vx=0;ball.vy=0;} }
  else if(k==='reset'){ ball.x=levelStart.x;ball.y=levelStart.y;ball.vx=0;ball.vy=0;ball.checkpoints=[{x:levelStart.x,y:levelStart.y}]; }
}
function explode(x,y){ burst(x,y,'#ff7a33',42,540); sfx('bomb'); for(let i=pegs.length-1;i>=0;i--){ const p=pegs[i]; if(Math.hypot(p.x-x,p.y-y)<CFG.bombR){ burst(p.x,p.y,'#ff2d95',8,200); pegs.splice(i,1); coinCount+=2; } } }
function spawnCoinRain(){ labels.push({x:ball.x,y:ball.y-20,text:'金币雨！',color:'#ffd24a',life:1.6}); for(let i=0;i<7;i++){ minis.push({x:ball.x+rand(-20,20),y:ball.y+rand(-10,10),vx:rand(-260,260),vy:rand(-380,-120),r:6,life:4,val:rand(0,1)<0.5?1:2}); } }
function damage(d){ if(now()<ball.invUntil)return; ball.hp-=d; ball.invUntil=now()+1100; burst(ball.x,ball.y,'#ff3355',18,320); sfx('bad'); updHud(); if(ball.hp<=0)loseLife(); }
function loseLife(){ state="dead"; labels.length=0; setTimeout(()=>{ ovTitle.textContent="没血了！"; ovTitle.className="lose"; ovStars.innerHTML=""; ovSub.textContent="本关重来（计时继续，金币回退本关）"; ovBtn.textContent="再试一次"; overlay.classList.add("show"); ovBtn.onclick=()=>{ coinCount=coinsAtLevelStart; loadLevel(levelIdx,false); }; }, 500); }

let celebrateStart=0;
function physicsStep(h){
  if(landed||state==='dead') return;
  if(ball.mode!=='normal'&&now()>ball.modeUntil){ ball.mode='normal'; }
  if(ball.sizeUntil&&now()>ball.sizeUntil){ ball.r=BASE_R; ball.sizeUntil=0; }
  ball.vy+=CFG.gravity*h; const drag=1-CFG.airDrag*h; ball.vx*=drag; ball.vy*=drag;
  if(now()<ball.magnetUntil){ const dx=exit.x-ball.x,dy=exit.y-ball.y,d=Math.hypot(dx,dy)||1; ball.vx+=dx/d*CFG.magnet*h; ball.vy+=dy/d*CFG.magnet*h; }
  let sp=Math.hypot(ball.vx,ball.vy); if(sp>CFG.maxSpeed){const k=CFG.maxSpeed/sp;ball.vx*=k;ball.vy*=k;}
  const move=Math.hypot(ball.vx,ball.vy)*h; const n=Math.max(1,Math.ceil(move/(ball.r*0.5))), hh=h/n;
  let stepImpact=0, contact=false, pegHit=false; const slowing=now()<ball.slowUntil;
  for(let i=0;i<n;i++){
    ball.x+=ball.vx*hh; ball.y+=ball.vy*hh;
    if(slowing) ball.vx*=CFG.slowDrag;
    for(const s of sands){ if(ball.x>s.x-s.w/2&&ball.x<s.x+s.w/2&&Math.abs(ball.y-s.y)<ball.r+10){ ball.vx*=CFG.sandDragX; ball.vy*=CFG.sandDragY; s.flash=now(); } }
    for(const c of coins){ if(!c.got&&Math.hypot(ball.x-c.x,ball.y-c.y)<ball.r+c.r){ c.got=true; coinCount++; burst(c.x,c.y,'#ffd24a',8,160); sfx('coin'); } }
    for(const ht of hearts){ if(!ht.got&&Math.hypot(ball.x-ht.x,ball.y-ht.y)<ball.r+9){ ht.got=true; ball.hp=Math.min(MAX_HP,ball.hp+1); burst(ht.x,ht.y,'#ff5d7a',12,200); sfx('coin'); updHud(); } }
    for(const fr of rings){ const d=Math.hypot(ball.x-fr.x,ball.y-fr.y); if(Math.abs(d-fr.r)<ball.r+6 && now()>ball.invUntil){ const nx=(ball.x-fr.x)/(d||1),ny=(ball.y-fr.y)/(d||1); ball.vx+=nx*420; ball.vy+=ny*420; damage(1); } }
    for(const b of boxes){ if(!b.revealed&&Math.hypot(ball.x-b.x,ball.y-b.y)<ball.r+b.r){ revealBox(b); if(landed||state==='dead')return; } }
    const r=resolveContacts(ball,true);
    if(r.contact){ contact=true; if(r.impact>stepImpact)stepImpact=r.impact; if(r.pegHit)pegHit=true; }
  }
  if(pegHit && stepImpact>60){ ball.combo++; if(ball.combo>ball.maxCombo)ball.maxCombo=ball.combo; sfx('combo',clamp(0.1+ball.combo*0.03,0.1,0.4),ball.combo); if(ball.mode==='bomb'||ball.mode==='heavy'){ explode(ball.x,ball.y); if(ball.mode==='bomb')ball.mode='normal'; } }
  if(contact){ const v=Math.hypot(ball.vx,ball.vy); if(v<CFG.sleepV){ball.vx*=0.4;ball.vy*=0.4;if(v<3){ball.vx=0;ball.vy=0;}} else if(v<90){ball.vx*=CFG.roll;} }
  if(stepImpact>120){ sfx('bounce',clamp(stepImpact/900,0.05,0.5)); spawnSparks(ball.x,ball.y,"#19e3ff",clamp(stepImpact/120,1,6)); }
  const dx=ball.x-exit.x, dy=ball.y-exit.y; if(dx*dx+dy*dy<(exit.r+ball.r*0.4)*(exit.r+ball.r*0.4)){ landed=true; onWin(); }
}

function updateMinis(dt){
  for(let i=minis.length-1;i>=0;i--){ const m=minis[i]; m.life-=dt; if(m.life<=0){minis.splice(i,1);continue;} m.vy+=CFG.gravity*dt; m.x+=m.vx*dt; m.y+=m.vy*dt;
    if(m.x<LEFT+m.r){m.x=LEFT+m.r;m.vx=Math.abs(m.vx)*0.7;} if(m.x>RIGHT-m.r){m.x=RIGHT-m.r;m.vx=-Math.abs(m.vx)*0.7;}
    if(m.y>BOTTOM-m.r){m.y=BOTTOM-m.r;m.vy=-Math.abs(m.vy)*0.6;} if(m.y<TOP+m.r){m.y=TOP+m.r;m.vy=Math.abs(m.vy)*0.6;}
    if(Math.hypot(ball.x-m.x,ball.y-m.y)<ball.r+m.r){ coinCount+=m.val; burst(m.x,m.y,'#ffd24a',6,150); sfx('coin'); minis.splice(i,1); }
  }
}

function predict(impX,impY){
  const b={x:ball.x,y:ball.y,vx:ball.vx+impX,vy:ball.vy+impY,r:ball.r,mode:ball.mode==='pierce'?'pierce':'normal'}; const pts=[]; const h=1/120;
  for(let i=0;i<150;i++){ b.vy+=CFG.gravity*h; const sp=Math.hypot(b.vx,b.vy); if(sp>CFG.maxSpeed){const k=CFG.maxSpeed/sp;b.vx*=k;b.vy*=k;} const move=Math.hypot(b.vx,b.vy)*h; const n=Math.max(1,Math.ceil(move/(b.r*0.5))),hh=h/n; for(let j=0;j<n;j++){ b.x+=b.vx*hh; b.y+=b.vy*hh; resolveContacts(b,false); } if(i%3===0)pts.push([b.x,b.y]); const dx=b.x-exit.x,dy=b.y-exit.y; if(dx*dx+dy*dy<(exit.r+b.r*0.4)*(exit.r+b.r*0.4))break; }
  return pts;
}

const trail=[], parts=[];
function spawnSparks(x,y,color,count){ for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(40,200);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:1,color});} }
function burst(x,y,color,count,spd){ for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(spd*0.3,spd);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color});} }
function updateParticles(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt*1.6; if(p.life<=0){parts.splice(i,1);continue;} p.vy+=600*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; }
  for(let i=labels.length-1;i>=0;i--){ const l=labels[i]; l.life-=dt*0.7; l.y-=dt*30; if(l.life<=0)labels.splice(i,1); }
  for(const fr of rings) fr.rot+=dt*1.2;

let actx=null, muted=false, lastBeep=0;
function sfx(type,vol,combo){ if(muted) return; try{
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime;
  if(type==='bounce'){ if(now()-lastBeep<35) return; lastBeep=now(); }
  const o=actx.createOscillator(), g=actx.createGain(); let f=440,d=0.08,v=vol||0.2,wave='sine';
  if(type==='launch'){f=220;d=0.12;v=0.25;wave='triangle';}
  else if(type==='bounce'){f=320+Math.random()*180;d=0.06;v=vol||0.12;wave='sine';}
  else if(type==='combo'){f=300+(combo||1)*40;d=0.07;v=vol||0.2;wave='square';}
  else if(type==='coin'){f=988;d=0.17;v=0.2;wave='square';}
  else if(type==='reveal'){f=620;d=0.18;v=0.3;wave='triangle';}
  else if(type==='bad'){f=160;d=0.24;v=0.32;wave='sawtooth';}
  else if(type==='bomb'){f=110;d=0.32;v=0.36;wave='sawtooth';}
  else if(type==='win'){f=660;d=0.6;v=0.32;wave='triangle';}
  o.type=wave; o.frequency.setValueAtTime(f,t);
  if(type==='launch')o.frequency.exponentialRampToValueAtTime(f*2.4,t+d);
  if(type==='win')o.frequency.exponentialRampToValueAtTime(f*2,t+d);
  if(type==='reveal')o.frequency.exponentialRampToValueAtTime(f*1.7,t+d);
  if(type==='coin'){o.frequency.setValueAtTime(988,t);o.frequency.setValueAtTime(1319,t+0.06);}
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.02);
}catch(e){} }

function resize(){ const rect=document.getElementById("stage").getBoundingClientRect(); DPR=Math.min(3,window.devicePixelRatio||1); cssW=rect.width; cssH=rect.height; canvas.width=Math.floor(cssW*DPR); canvas.height=Math.floor(cssH*DPR); scale=Math.min(cssW/W,cssH/H); offX=(cssW-W*scale)/2; offY=(cssH-H*scale)/2; }

function roundRectPath(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

      ctx.beginPath(); ctx.moveTo(bx2+px*wd,by2+py*wd); ctx.quadraticCurveTo(bx2+ca*h*0.5,by2+sa*h*0.5,tx,ty); ctx.quadraticCurveTo(bx2+ca*h*0.5,by2+sa*h*0.5,bx2-px*wd,by2-py*wd); ctx.closePath(); ctx.fill(); ctx.restore(); }

  if(now()<ball.magnetUntil && !landed){ ctx.save(); ctx.strokeStyle="rgba(255,138,214,.5)"; ctx.lineWidth=1.5; ctx.setLineDash([4,5]); ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(exit.x,exit.y); ctx.stroke(); ctx.restore(); }
  if(charging&&previewPts.length){ ctx.save(); ctx.fillStyle="rgba(255,255,255,.55)"; for(let i=0;i<previewPts.length;i++){ ctx.globalAlpha=(1-i/previewPts.length)*0.7; ctx.beginPath(); ctx.arc(previewPts[i][0],previewPts[i][1],2.4,0,Math.PI*2); ctx.fill(); } ctx.restore(); }
  if(!landed&&state==='play') for(let i=0;i<trail.length;i++){ const a=i/trail.length; ctx.globalAlpha=a*0.5; ctx.fillStyle="#19e3ff"; ctx.beginPath(); ctx.arc(trail[i][0],trail[i][1],ball.r*0.7*a,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1;
  if((!landed&&state!=='dead')||now()-celebrateStart<900){ const cols=MODE_COLOR[ball.mode]||MODE_COLOR.normal; const inv=now()<ball.invUntil&&Math.floor(now()/100)%2===0; ctx.save(); ctx.globalAlpha=inv?0.4:1; if(ball.mode==='pierce')ctx.globalAlpha*=0.75; ctx.shadowColor=cols[1]; ctx.shadowBlur=ball.mode==='bomb'||ball.mode==='heavy'?24:18; const bg=ctx.createRadialGradient(ball.x-ball.r*0.3,ball.y-ball.r*0.3,1,ball.x,ball.y,ball.r); bg.addColorStop(0,cols[0]); bg.addColorStop(0.5,cols[1]); bg.addColorStop(1,cols[2]); ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.restore(); if(now()<ball.frozenUntil){ ctx.save(); ctx.strokeStyle="#7fc8ff"; ctx.lineWidth=2; ctx.shadowColor="#7fc8ff"; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r+3,0,Math.PI*2); ctx.stroke(); ctx.restore(); } if(ball.combo>=2){ ctx.save(); ctx.fillStyle="#ffe14d"; ctx.font="bold 13px system-ui"; ctx.textAlign="center"; ctx.shadowColor="#ffe14d"; ctx.shadowBlur=8; ctx.fillText("x"+ball.combo,ball.x,ball.y-ball.r-6); ctx.restore(); } }
  if(charging){ const dir=chargeSide==='L'?-1:1; let ix=dir*Math.cos(0.5),iy=-Math.sin(0.5)-CFG.upRatio; const m=Math.hypot(ix,iy);ix/=m;iy/=m; const len=20+charge*46; ctx.save(); ctx.strokeStyle=chargeSide==='L'?"#19e3ff":"#9b5cff"; ctx.lineWidth=3; ctx.lineCap="round"; ctx.shadowColor=ctx.strokeStyle; ctx.shadowBlur=12; ctx.beginPath(); ctx.moveTo(ball.x,ball.y); ctx.lineTo(ball.x+ix*len,ball.y+iy*len); ctx.stroke(); ctx.restore(); }
  for(const p of parts){ ctx.globalAlpha=clamp(p.life,0,1); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.2,0,Math.PI*2); ctx.fill(); } ctx.globalAlpha=1;
  for(const l of labels){ ctx.save(); ctx.globalAlpha=clamp(l.life,0,1); ctx.fillStyle=l.color; ctx.font="bold 15px system-ui"; ctx.textAlign="center"; ctx.shadowColor=l.color; ctx.shadowBlur=8; ctx.fillText(l.text,l.x,l.y); ctx.restore(); }
  ctx.restore();
}

let levelIdx=0, state="play";
let charging=false, chargeSide=null, chargeStart=0, charge=0, previewPts=[];
const elLvName=document.getElementById("lvName"), elTime=document.getElementById("timeEl"), elCoin=document.getElementById("coinEl"), elHp=document.getElementById("hpEl");
const elBigHint=document.getElementById("bigHint"), overlay=document.getElementById("overlay");
const ovTitle=document.getElementById("ovTitle"), ovStars=document.getElementById("ovStars"), ovSub=document.getElementById("ovSub"), ovBtn=document.getElementById("ovBtn");
const padL=document.getElementById("padL"), padR=document.getElementById("padR");
const boardEl=document.getElementById("board"), boardRows=document.getElementById("boardRows");
let hintTimer=null;

function loadBest(){ try{return JSON.parse(localStorage.getItem('springdrop_best')||'{}');}catch(e){return{};} }
function saveBest(b){ try{localStorage.setItem('springdrop_best',JSON.stringify(b));}catch(e){} }
function setHp(){ let s='<span style="color:#ff5d7a">'; for(let i=0;i<ball.hp;i++)s+='♥'; s+='</span>'; elHp.innerHTML=s||'<span style="color:#3a2030">·</span>'; }
function updHud(){ elTime.textContent=elapsed.toFixed(1)+'s'; elCoin.textContent='◆ '+coinCount; setHp(); }

function loadLevel(i, fresh){
  levelIdx=i; state="play"; landed=false; charging=false; chargeSide=null; charge=0; previewPts=[];
  parts.length=0; trail.length=0; score=0; minis.length=0; buildLevel(i); ball.hp=3;
  if(fresh){ gameT0=now(); coinCount=0; }
  coinsAtLevelStart=coinCount;
  elLvName.textContent=`第 ${i+1} 关 · ${LEVELS[i].name}`;
  updHud(); setHp();
  elBigHint.textContent=LEVELS[i].tip||""; elBigHint.style.opacity="0.9"; overlay.classList.remove("show");
  if(hintTimer)clearTimeout(hintTimer); hintTimer=setTimeout(()=>{elBigHint.style.opacity="0";},4200);
}
function startCharge(side){ if(state!=="play"||landed) return; if(now()<ball.frozenUntil){ labels.push({x:ball.x,y:ball.y-18,text:'冻住了',color:'#7fc8ff',life:0.8}); return; } charging=true; chargeSide=side; chargeStart=now(); charge=0; (side==='L'?padL:padR).classList.add("press"); elBigHint.style.opacity="0"; }
function releaseCharge(){
  if(!charging) return; charging=false; padL.classList.remove("press"); padR.classList.remove("press");
  ball.checkpoints.push({x:ball.x,y:ball.y}); if(ball.checkpoints.length>12)ball.checkpoints.shift();
  const dir=chargeSide==='L'?-1:1; let power=lerp(CFG.minImpulse,CFG.maxImpulse,charge); if(ball.mode==='heavy')power*=0.62;
  let ix=dir*Math.cos(0.5), iy=-Math.sin(0.5)-CFG.upRatio; const m=Math.hypot(ix,iy); ix/=m; iy/=m;
  ball.vx+=ix*power; ball.vy+=iy*power; ball.combo=0;
  sfx('launch'); burst(ball.x,ball.y,chargeSide==='L'?"#19e3ff":"#9b5cff",10,220); chargeSide=null; previewPts=[];
}
function onWin(){
  state="win"; celebrateStart=now(); burst(exit.x,exit.y,"#3dff9e",70,460); sfx('win');
  const last=levelIdx>=LEVELS.length-1;
  if(!last){ labels.push({x:exit.x,y:exit.y-32,text:`第 ${levelIdx+1} 关 ✓`,color:'#3dff9e',life:1.6}); setTimeout(()=>loadLevel(levelIdx+1,false),720); return; }
  const tm=elapsed; const best=loadBest(); const rec=best.all||{time:1e9,coins:-1};
  const newTime=tm<rec.time, newCoin=coinCount>rec.coins;
  best.all={time:Math.min(tm,rec.time),coins:Math.max(coinCount,rec.coins)}; saveBest(best);
  const cb=ball.maxCombo>=3?` · 最高连击 x${ball.maxCombo}`:"";
  setTimeout(()=>{
    ovTitle.textContent="🎉 全部通关！"; ovTitle.className=""; ovStars.innerHTML="★★★";
    let rl=""; if(newTime)rl+="<span class='rec'>⚡ 最快纪录！</span> "; if(newCoin)rl+="<span class='rec'>◆ 金币纪录！</span>";
    ovSub.innerHTML=`全程 15 关用时 <b>${tm.toFixed(1)}s</b> · 总金币 <span style='color:#ffd24a'>${coinCount}</span>${cb}<br/>${rl||"个人最佳 "+best.all.time.toFixed(1)+"s / ◆"+best.all.coins}`;
    ovBtn.textContent="再玩一轮"; overlay.classList.add("show"); ovBtn.onclick=()=>loadLevel(0,true);
  }, 850);
}
function showBoard(){ const best=loadBest(); const a=best.all; let html='<div class="row head"><span class="n">全程 15 关</span><span class="t">最快用时</span><span class="c">最多金币</span></div>'; html+=`<div class="row"><span class="n">通关纪录</span><span class="t">${a?a.time.toFixed(1)+'s':'未通关'}</span><span class="c">${a?'◆'+a.coins:'—'}</span></div>`; html+='<div class="row" style="border:none;color:#7da6c4;font-size:12px;margin-top:10px;display:block;text-align:center">目标：用最短时间通关全部 15 关，金币越多越好</div>'; boardRows.innerHTML=html; boardEl.classList.add("show"); }

function bindPad(el,side){ const down=(e)=>{ e.preventDefault(); try{el.setPointerCapture(e.pointerId);}catch(_){} if(actx&&actx.state==='suspended')actx.resume(); startCharge(side); }; const up=(e)=>{ e.preventDefault(); releaseCharge(); }; el.addEventListener("pointerdown",down); el.addEventListener("pointerup",up); el.addEventListener("pointercancel",up); }
bindPad(padL,'L'); bindPad(padR,'R');
document.addEventListener("keydown",(e)=>{ if(e.repeat)return; const k=e.key.toLowerCase(); if(e.key==="ArrowLeft"||k==="a")startCharge('L'); else if(e.key==="ArrowRight"||k==="d")startCharge('R'); else if(k==="r"){ coinCount=coinsAtLevelStart; loadLevel(levelIdx,false); } });
document.addEventListener("keyup",(e)=>{ const k=e.key.toLowerCase(); if((e.key==="ArrowLeft"||k==="a")&&chargeSide==='L')releaseCharge(); else if((e.key==="ArrowRight"||k==="d")&&chargeSide==='R')releaseCharge(); });
document.getElementById("resetBtn").addEventListener("click",()=>{ coinCount=coinsAtLevelStart; loadLevel(levelIdx,false); });
document.getElementById("muteBtn").addEventListener("click",function(){ muted=!muted; this.textContent=muted?"♪̸":"♪"; this.style.opacity=muted?"0.4":"1"; });
document.getElementById("boardBtn").addEventListener("click",showBoard);
document.getElementById("boardClose").addEventListener("click",()=>boardEl.classList.remove("show"));

const FIXED=1/120; let acc=0, lastTs=0;
function frame(ts){
  if(!lastTs) lastTs=ts; let dt=(ts-lastTs)/1000; lastTs=ts; if(dt>0.1) dt=0.1;
  if(state==="play"){ elapsed=(now()-gameT0)/1000; elTime.textContent=elapsed.toFixed(1)+'s'; }
  if(charging){ charge=clamp((now()-chargeStart)/CFG.chargeMs,0,1); const dir=chargeSide==='L'?-1:1; let power=lerp(CFG.minImpulse,CFG.maxImpulse,charge); if(ball.mode==='heavy')power*=0.62; let ix=dir*Math.cos(0.5),iy=-Math.sin(0.5)-CFG.upRatio; const m=Math.hypot(ix,iy);ix/=m;iy/=m; previewPts=predict(ix*power,iy*power); }
  if(state==="play"){ acc+=dt; let steps=0; while(acc>=FIXED&&steps<10){ physicsStep(FIXED); acc-=FIXED; steps++; } }
  const pdt=(state==="win"&&now()-celebrateStart<900)?dt*0.4:dt;
  updateMinis(pdt); updateParticles(pdt); draw(); requestAnimationFrame(frame);
}
resize(); loadLevel(0,true); requestAnimationFrame(frame);

})();
</script>
</body>
